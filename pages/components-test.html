<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Components Test | EMIFORMULA</title>

  <link
    rel="stylesheet"
    href="../assets/css/style.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/header.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/search.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/footer.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/responsive.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/layout.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/components.css"
  >

</head>


<body>

  <!-- Shared Header -->

  <div data-component="header"></div>


  <main class="page-main">

    <div class="page-container">

      <section class="page-section">

        <!-- Breadcrumb Component -->

        <div data-component="breadcrumbs"></div>


        <!-- Page Title Component -->

        <div data-component="page-title"></div>


        <!-- Test Content -->

        <div class="content-stack">

          <div class="card">

            <h2>
              Component System Test
            </h2>

            <p>
              This page verifies that the shared
              breadcrumb and page-title components
              load correctly.
            </p>

          </div>


          <div class="card">

            <h2>
              Test Status
            </h2>

            <p>
              Breadcrumb component should appear
              above the page title.
            </p>

            <p>
              Page title and description should
              load automatically.
            </p>

          </div>

        </div>

      </section>

    </div>

  </main>


  <!-- Shared Footer -->

  <div data-component="footer"></div>


  <!-- Shared Scripts -->

  <script src="../assets/js/site-config.js"></script>

  <script src="../assets/js/site.js"></script>

  <script src="../assets/js/search-data.js"></script>

  <script src="../assets/js/search.js"></script>

  <script src="../assets/js/footer.js"></script>

  <script src="../assets/js/components.js"></script>


</body>

</html>
