<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Calculator Page Test | EMIFORMULA</title>

  <link
    rel="stylesheet"
    href="../assets/css/style.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/header.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/search.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/footer.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/responsive.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/layout.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/components.css"
  >

</head>

<body>

  <div class="page-shell">

    <div data-component="header"></div>


    <main class="page-main">

      <div class="page-container">

        <section class="page-section">

          <div class="page-full">

            <div
              data-component="breadcrumbs"
            ></div>


            <div
              data-component="page-title"
            ></div>


            <div class="page-grid">

              <div class="page-content">

                <div class="card">

                  <h2>Calculator</h2>

                  <div class="content-stack">

                    <div class="form-group">

                      <label for="calculator-input">
                        Sample Input
                      </label>

                      <input
                        id="calculator-input"
                        type="number"
                        inputmode="decimal"
                        placeholder="Enter value"
                      >

                    </div>


                    <button
                      class="button"
                      type="button"
                    >
                      Calculate
                    </button>


                    <div
                      class="card"
                      aria-live="polite"
                    >

                      <h3>Result</h3>

                      <p>
                        Calculator result will appear here.
                      </p>

                    </div>

                  </div>

                </div>


                <div class="card">

                  <h2>About This Calculator</h2>

                  <p>
                    This is a test of the
                    EMIFORMULA calculator page
                    structure.
                  </p>

                </div>

              </div>


              <aside class="page-sidebar">

                <div class="card">

                  <h2>Related Calculators</h2>

                  <p>
                    Related calculators will
                    appear here.
                  </p>

                </div>

              </aside>

            </div>

          </div>

        </section>

      </div>

    </main>


    <div data-component="footer"></div>

  </div>


  <script src="../assets/js/site-config.js"></script>

  <script src="../assets/js/site.js"></script>

  <script src="../assets/js/search-data.js"></script>

  <script src="../assets/js/search.js"></script>

  <script src="../assets/js/footer.js"></script>

  <script src="../assets/js/components.js"></script>

  <script src="../assets/js/navigation.js"></script>

</body>

</html>
