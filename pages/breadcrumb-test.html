<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Breadcrumb Test | EMIFORMULA</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/header.css">
  <link rel="stylesheet" href="../assets/css/search.css">
  <link rel="stylesheet" href="../assets/css/footer.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">

</head>


<body>

  <div class="page-shell">

    <div data-component="header"></div>


    <main class="page-main">

      <div class="page-container">

        <section class="page-section">


          <!-- Dynamic Breadcrumb -->

          <div
            data-dynamic-breadcrumbs
          >

            <nav
              class="breadcrumbs"
              aria-label="Breadcrumb"
            >

              <ol class="breadcrumb-list"></ol>

            </nav>

          </div>


          <!-- Page Title -->

          <div
            data-component="page-title"
          ></div>


          <div class="content-medium">

            <div class="card">

              <h2>
                Dynamic Breadcrumb Test
              </h2>

              <p>
                This page tests the new
                data-driven breadcrumb system.
              </p>

            </div>

          </div>


        </section>

      </div>

    </main>


    <div data-component="footer"></div>

  </div>


  <!-- Shared systems -->

  <script src="../assets/js/site-config.js"></script>

  <script src="../assets/js/site.js"></script>

  <script src="../assets/js/search-data.js"></script>

  <script src="../assets/js/search.js"></script>

  <script src="../assets/js/footer.js"></script>

  <script src="../assets/js/components.js"></script>

  <script src="../assets/js/navigation.js"></script>


  <!-- STEP 2.5 -->

  <script src="../assets/js/breadcrumb-data.js"></script>

  <script src="../assets/js/breadcrumb.js"></script>


</body>

</html>
