<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Standard Page | EMIFORMULA</title>

  <link
    rel="stylesheet"
    href="../assets/css/style.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/header.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/search.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/footer.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/responsive.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/layout.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/components.css"
  >

  <link rel="icon" href="../assets/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">
  <link rel="manifest" href="../assets/images/site.webmanifest">
</head>


<body>

  <div class="page-shell">


    <!-- =================================================
         SHARED HEADER
         ================================================= -->

    <div data-component="header"></div>


    <!-- =================================================
         MAIN PAGE
         ================================================= -->

    <main class="page-main">

      <div class="page-container">


        <!-- Breadcrumb -->

        <section class="page-section">

          <div class="page-full">

            <div
              data-component="breadcrumbs"
            ></div>


            <!-- Page Title -->

            <div
              data-component="page-title"
            ></div>


            <!-- =================================================
                 PAGE CONTENT
                 Replace this content for each standard page.
                 ================================================= -->

            <div class="content-medium">

              <div class="card">

                <h2>Page Content</h2>

                <p>
                  This is the standard EMIFORMULA
                  page template.
                </p>

                <p>
                  Replace this section with the
                  content of the individual page.
                </p>

              </div>

            </div>

          </div>

        </section>

      </div>

    </main>


    <!-- =================================================
         SHARED FOOTER
         ================================================= -->

    <div data-component="footer"></div>


  </div>


  <!-- =================================================
       SHARED JAVASCRIPT
       ================================================= -->

  <script src="../assets/js/site-config.js"></script>

  <script src="../assets/js/site.js"></script>

  <script src="../assets/js/search-data.js"></script>

  <script src="../assets/js/search.js"></script>

  <script src="../assets/js/footer.js"></script>

  <script src="../assets/js/components.js"></script>

  <script src="../assets/js/navigation.js"></script>


</body>

</html>
