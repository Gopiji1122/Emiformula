<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Calculator | EMIFORMULA</title>

  <link
    rel="stylesheet"
    href="../assets/css/style.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/header.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/search.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/footer.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/responsive.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/layout.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/components.css"
  >

</head>

<body>

  <div class="page-shell">

    <!-- Shared Header -->
    <div data-component="header"></div>


    <main class="page-main">

      <div class="page-container">

        <section class="page-section">

          <div class="page-full">

            <!-- Breadcrumb -->
            <div
              data-component="breadcrumbs"
            ></div>


            <!-- Calculator Page Title -->
            <div
              data-component="page-title"
            ></div>


            <div class="page-grid">

              <!-- =========================
                   MAIN CALCULATOR AREA
                   ========================= -->

              <div class="page-content">

                <div class="card">

                  <h2>Calculator</h2>

                  <div class="content-stack">

                    <div class="form-group">

                      <label for="calculator-input">
                        Sample Input
                      </label>

                      <input
                        id="calculator-input"
                        type="number"
                        inputmode="decimal"
                        placeholder="Enter value"
                      >

                    </div>


                    <button
                      class="button"
                      type="button"
                    >
                      Calculate
                    </button>


                    <!-- Result -->
                    <div
                      class="card"
                      aria-live="polite"
                    >

                      <h3>Result</h3>

                      <p>
                        Calculator result will appear here.
                      </p>

                    </div>

                  </div>

                </div>


                <!-- Calculator Information -->

                <div class="card">

                  <h2>About This Calculator</h2>

                  <p>
                    This section will contain
                    information about the calculator,
                    its purpose and how to use it.
                  </p>

                </div>

              </div>


              <!-- =========================
                   SIDEBAR
                   ========================= -->

              <aside class="page-sidebar">

                <div class="card">

                  <h2>Related Calculators</h2>

                  <p>
                    Related calculator links
                    will be added here.
                  </p>

                </div>

              </aside>

            </div>

          </div>

        </section>

      </div>

    </main>


    <!-- Shared Footer -->
    <div data-component="footer"></div>

  </div>


  <!-- Shared JavaScript -->

  <script src="../assets/js/site-config.js"></script>

  <script src="../assets/js/site.js"></script>

  <script src="../assets/js/search-data.js"></script>

  <script src="../assets/js/search.js"></script>

  <script src="../assets/js/footer.js"></script>

  <script src="../assets/js/components.js"></script>

  <script src="../assets/js/navigation.js"></script>

</body>

</html>
