<!--
  EMIFORMULA — Shared Header Component
  STEP 1.3 — Header & Logo System

  This file is the reusable header.
  Future pages should load this component instead of copying the header HTML.
-->

<header class="site-header" data-site-header>
  <div class="header-container">

    <a class="site-logo" href="../index.html" aria-label="EMIFORMULA home">
      <span class="site-logo-mark" aria-hidden="true">E</span>
      <span class="site-logo-text">EMIFORMULA</span>
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a class="nav-link nav-link-active" href="../index.html">Home</a>

      <button class="nav-button" type="button" data-header-menu="calculators"
              aria-expanded="false" aria-controls="calculator-menu">
        Calculators
        <span class="nav-chevron" aria-hidden="true">⌄</span>
      </button>

      <button class="nav-button" type="button" data-header-menu="guides"
              aria-expanded="false" aria-controls="guide-menu">
        Guides
        <span class="nav-chevron" aria-hidden="true">⌄</span>
      </button>

      <button class="nav-button" type="button" data-header-menu="about"
              aria-expanded="false" aria-controls="about-menu">
        About
        <span class="nav-chevron" aria-hidden="true">⌄</span>
      </button>
    </nav>

    <div class="header-actions">
      <button class="header-icon-button" type="button"
              aria-label="Search (coming in Step 1.4)"
              title="Search will be added in Step 1.4"
              data-header-search>
        <span aria-hidden="true">⌕</span>
      </button>

      <button class="menu-toggle" type="button"
              aria-label="Open navigation menu"
              aria-expanded="false"
              aria-controls="mobile-navigation"
              data-menu-toggle>
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>

  <div class="header-panel" id="calculator-menu" data-header-panel="calculators" hidden>
    <div class="header-panel-inner">
      <strong>EMI Calculators</strong>
      <p>Calculator pages will be connected here after the core is complete.</p>
    </div>
  </div>

  <div class="header-panel" id="guide-menu" data-header-panel="guides" hidden>
    <div class="header-panel-inner">
      <strong>EMI & Loan Guides</strong>
      <p>Guide pages will be connected here after the core is complete.</p>
    </div>
  </div>

  <div class="header-panel" id="about-menu" data-header-panel="about" hidden>
    <div class="header-panel-inner">
      <strong>About EMIFORMULA</strong>
      <p>About and trust pages will be added in a later core step.</p>
    </div>
  </div>

  <div class="mobile-navigation" id="mobile-navigation" data-mobile-navigation hidden>
    <nav aria-label="Mobile navigation">
      <a class="mobile-nav-link" href="../index.html">Home</a>

      <button class="mobile-nav-button" type="button" data-mobile-panel="calculators">
        Calculators
        <span aria-hidden="true">+</span>
      </button>

      <button class="mobile-nav-button" type="button" data-mobile-panel="guides">
        Guides
        <span aria-hidden="true">+</span>
      </button>

      <button class="mobile-nav-button" type="button" data-mobile-panel="about">
        About
        <span aria-hidden="true">+</span>
      </button>
    </nav>
  </div>
</header>
